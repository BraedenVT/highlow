name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: highlow-windows
            built: dist/highlow.exe
            final: dist/highlow-windows.exe
          - os: ubuntu-22.04
            artifact: highlow-linux
            built: dist/highlow
            final: dist/highlow-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyinstaller readchar

      - run: pyinstaller --onefile --copy-metadata readchar highlow.py

      - name: Rename binary
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.final }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.final }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
