name: build-windows
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller readchar
      - run: pyinstaller --onefile --copy-metadata readchar highlow.py
      - uses: actions/upload-artifact@v4
        with:
          name: highlow-windows
          path: dist/highlow.exe
on:
  push:
  workflow_dispatch:
